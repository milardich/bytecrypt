# This workflow builds the standalone PyInstaller executables and attaches them
# to the GitHub release. The download links in the README point at the assets of
# the latest release.

name: Build executables

on:
  release:
    types: [published]

permissions:
  contents: write  # upload assets to the release

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: bytecrypt.exe
          - os: ubuntu-latest
            asset: bytecrypt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Install package + pyinstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
      - name: Build executable
        run: pyinstaller --onefile --name bytecrypt --console src/bytecrypt/__main__.py
      - name: Attach to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: dist/${{ matrix.asset }}
