# This workflow builds the standalone PyInstaller executables and attaches them
# to the GitHub release. The download links in the README point at the assets of
# the latest release.

name: Build executables

on:
  release:
    types: [published]

permissions:
  contents: write  # upload assets to the release

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: bytecrypt.exe
          - os: ubuntu-latest
            asset: bytecrypt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package + pyinstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
      - name: Build executable
        run: pyinstaller --onefile --name bytecrypt --console src/bytecrypt/__main__.py
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
