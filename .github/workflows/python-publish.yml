# This workflow publishes bytecrypt to PyPI after a published GitHub release.
# It uses PyPI Trusted Publishing with OIDC, thus it needs no API token and no
# PYPI_PASSWORD secret.
#
# Set this up one time on PyPI. Add a Trusted Publisher for this project. Point
# it at this repository and at the workflow file `python-publish.yml`. See
# https://docs.pypi.org/trusted-publishers/.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.x'
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
