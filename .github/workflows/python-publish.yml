# This workflow publishes bytecrypt to PyPI after a published GitHub release.
# It uses PyPI Trusted Publishing with OIDC, thus it needs no API token and no
# PYPI_PASSWORD secret.
#
# Set this up one time on PyPI. Add a Trusted Publisher for this project. Point
# it at this repository and at the workflow file `python-publish.yml`. See
# https://docs.pypi.org/trusted-publishers/.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
